# Compose v2: sin la clave "version".
services:
  # Base de datos PostgreSQL con volumen nombrado y sonda de disponibilidad.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-metricas}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-metricas}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Aplicación: espera a que PostgreSQL esté sano antes de arrancar.
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # La cadena apunta al nombre del servicio y usa los mismos valores por defecto.
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-dev_password}@postgres:5432/${POSTGRES_DB:-metricas}?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  datos_postgres:
