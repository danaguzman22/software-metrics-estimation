{{define "contenido"}}
<h1>Proyectos</h1>
<p><a href="/proyectos/nuevo">Crear proyecto</a></p>
{{if .Proyectos}}
<table class="tabla">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nombre</th>
      <th>Fecha de inicio</th>
      <th>Fecha de fin</th>
      <th>Estado</th>
    </tr>
  </thead>
  <tbody>
    {{range .Proyectos}}
    <tr>
      <td>{{.ID}}</td>
      <td><a href="/proyectos/{{.ID}}">{{.Nombre}}</a></td>
      <td>{{.FechaInicio}}</td>
      <td>{{.FechaFin}}</td>
      <td>{{.Estado}}</td>
    </tr>
    {{end}}
  </tbody>
</table>
{{else}}
<p>No hay proyectos registrados</p>
{{end}}
{{end}}
